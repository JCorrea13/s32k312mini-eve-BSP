name: MISRA Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  analyse:
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # Required to upload security scan results to the Security tab
      contents: read          # Required to check out the repository code

    steps:
      - name: Checkout Code
        id: repo_checkout
        uses: actions/checkout@v4

      - name: Install Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run Cppcheck Analysis with MISRA Addon
        # Analyze only C translation units under src. The include paths let
        # Cppcheck resolve project and CMSIS headers without checking them as
        # independent MISRA targets.
        run: |
          cppcheck \
            -I s32k312mini_eve_BSP/include \
            -I s32k312mini_eve_BSP/src \
            --enable=all \
            --dump \
            --addon=misra.json \
            --xml-version=2 \
            --xml \
            --error-exitcode=1 \
            --output-file=report.xml \
            $(find s32k312mini_eve_BSP/src -type f -name '*.c' -print)

      - name: Convert report to SARIF format
        if: always() && steps.repo_checkout.outcome == 'success'
        uses: Flast/cppcheck-sarif@v2
        with:
          input: report.xml
          output: report.sarif

      - name: Normalize SARIF line numbers
        if: always() && hashFiles('report.sarif') != ''
        run: |
          jq 'walk(if type == "object" and (.startLine? | type == "number") and .startLine < 1 then .startLine = 1 else . end)' report.sarif > report.sarif.tmp
          mv report.sarif.tmp report.sarif

      - name: Upload Results to GitHub Security Tab
        if: always() && hashFiles('report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: report.sarif
          category: cppcheck-misra
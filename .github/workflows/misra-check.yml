name: MISRA Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  analyse:
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # Required to upload security scan results to the Security tab
      contents: read          # Required to check out the repository code

    steps:
      - name: Checkout Code
        id: repo_checkout
        uses: actions/checkout@v4

      - name: Checkout Unity Testing Framework
        uses: actions/checkout@v4
        with:
          repository: 'ThrowTheSwitch/Unity'
          path: 'github_actions_unity' # Clones it into a temporary runner folder

      - name: Build and Run Tests
        env:
          # We point the Makefile to the temporary directory cloned in step 1
          UNITY_DIR: ${{ github.workspace }}/github_actions_unity/src
        run: |
          make clean
          make
          ./Debug/s32k312mini_eve_BSP_utests

name: MISRA Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  analyse:
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # Required to upload security scan results to the Security tab
      contents: read          # Required to check out the repository code

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run Cppcheck Analysis with MISRA Addon
        # --dump: Generates intermediate files required by misra.py
        # --addon: Points to your misra.json file in the repository root
        # --xml: Formats findings into an XML file for conversion
        run: |
          cppcheck --enable=all --dump --addon=misra.json --xml --output-file=report.xml .

      - name: Convert report to SARIF format
        uses: Flast/cppcheck-sarif@v2
        with:
          input: report.xml
          output: report.sarif

      - name: Upload Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: report.sarif
          category: cppcheck-misra

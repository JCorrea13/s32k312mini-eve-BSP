name: MISRA Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  analyse:
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # Required to upload security scan results to the Security tab
      contents: read          # Required to check out the repository code

    steps:
      - name: Checkout Code
        id: repo_checkout
        uses: actions/checkout@v4

      - name: Install Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run Cppcheck Analysis
        run: |
          cppcheck -i s32k312mini_eve_BSP/Project_Settings --enable=all --xml-version=2 --xml --error-exitcode=1 --output-file=report.xml .

      - name: Convert report to SARIF format
        if: always() && steps.repo_checkout.outcome == 'success'
        uses: Flast/cppcheck-sarif@v2
        with:
          input: report.xml
          output: report.sarif

      - name: Upload Results to GitHub Security Tab
        if: always() && hashFiles('report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: report.sarif
          category: cppcheck-misra

      - name: Checkout Unity Testing Framework
        uses: actions/checkout@v4
        with:
          repository: 'ThrowTheSwitch/Unity'
          path: 'github_actions_unity' # Clones it into a temporary runner folder

      - name: Build and Run Tests
        env:
          # We point the Makefile to the temporary directory cloned in step 1
          UNITY_DIR: ${{ github.workspace }}/github_actions_unity/src
        run: |
          make clean
          make
          ./Debug/s32k312mini_eve_BSP_utests
